org.gradle.jvmargs=-Xmx2G

# Pinned to the same 1.21.11 stack Blitz itself builds against. If you bump these, bump Blitz's
# too -- an addon built against a different Minecraft than the client it loads into is the single
# most common way for one of these to fail at runtime rather than at compile time.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

mod_version=1.3.5
maven_group=com.example
archives_base_name=kreig-addon
